<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E9AA7">
<title>오사카 여행 플래너</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
<style>
:root{
  --bg:#E6F6F5; --card:#FFFFFF; --tx:#0F2A3A; --sub:#58737F; --line:#BFE3E0; --sea:#0E9AA7; --sea2:#08707A; --sun:#FFC83D; --sunt:#3a2a00; --ok:#1E9E62; --warn:#C2410C;
  --font-body:"Pretendard Variable",Pretendard,system-ui,sans-serif; --font-head:"Black Han Sans","Pretendard Variable",sans-serif; --font-num:"Poppins",sans-serif;
}
:root[data-theme=dark]{--bg:#0A1D26;--card:#12303D;--tx:#EAF6F6;--sub:#8FB0B8;--line:#1F4857;--sea:#34C8D4;--sea2:#7FE0E8;--sun:#FFC83D;--sunt:#3a2a00;--ok:#52D79A;--warn:#FFB27A}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--font-body);background:var(--bg);color:var(--tx);font-size:18px;line-height:1.6;transition:background .25s,color .25s;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
body.mapmode{overflow:hidden;padding-bottom:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
.wrap{max-width:560px;margin:0 auto}
.hero{background:linear-gradient(135deg,var(--sea),var(--sea2));color:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px 22px;border-radius:0 0 28px 28px;position:relative;overflow:hidden}
.hero:after{content:"🌊";position:absolute;right:-6px;bottom:-14px;font-size:92px;opacity:.22}
.hero h1{font-family:var(--font-head);font-weight:400;font-size:28px;line-height:1.2}
.hero p{font-size:15px;opacity:.92;margin-top:2px}
.hero .dd{display:inline-block;margin-top:10px;background:var(--sun);color:var(--sunt);font-weight:800;border-radius:10px;padding:5px 12px;font-size:15px}
.mode{position:absolute;right:14px;top:calc(14px + env(safe-area-inset-top));z-index:3;border:2px solid rgba(255,255,255,.7);color:#fff;border-radius:10px;padding:6px 10px;font-size:13.5px;font-weight:700;transition:.15s}
.mode:hover{background:rgba(255,255,255,.2)}
.pane{display:none;padding:16px;animation:in .3s ease both}.pane.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.days{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:-18px 14px 0;position:relative;z-index:2}
.days button{background:var(--card);border-radius:14px;padding:8px 2px 7px;text-align:center;box-shadow:0 4px 12px rgba(8,60,70,.14);transition:transform .15s,background .15s;min-height:62px;border:2px solid transparent}
.days button:hover{transform:translateY(-2px)}
.days button b{display:block;font-family:var(--font-num);font-size:18px;line-height:1.2}
.days button span{display:block;font-size:12.5px;color:var(--sub);font-weight:700}
.days button.on{background:var(--sun);color:var(--sunt);border-color:var(--sunt)}
.days button.on span{color:var(--sunt)}

h2.sec{font-family:var(--font-head);font-weight:400;font-size:22px;margin:22px 2px 10px}
.must{background:var(--card);border-radius:18px;padding:6px 14px;box-shadow:0 3px 0 var(--line)}
.mi{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);width:100%}
.mi:last-child{border:0}
.box{flex:none;width:34px;height:34px;border-radius:10px;border:3px solid var(--sea);display:flex;align-items:center;justify-content:center;font-size:20px;color:transparent;transition:.18s;margin-top:2px}
.mi:hover .box{background:var(--line)}
.mi.done .box{background:var(--ok);border-color:var(--ok);color:#fff;transform:scale(1.06)}
.mi b{display:block;font-size:17.5px;line-height:1.35}
.mi.done b{color:var(--sub);text-decoration:line-through}
.mi span.w{display:block;font-size:14.5px;color:var(--sub)}
.mi .go{display:inline-block;margin-top:4px;color:var(--sea2);font-weight:800;font-size:15px;border-bottom:2px solid currentColor;padding:4px 0 1px}
:root[data-theme=dark] .mi .go{color:var(--sea)}
.as{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.as button{background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:8px 14px;font-weight:800;font-size:15px;min-height:44px}
.as button:hover{border-color:var(--sea)}
.empty{padding:16px 4px;color:var(--sub);font-size:16px}
.mi .mx{flex:none;margin-left:auto;display:flex;gap:4px}
.mi .mx button{font:inherit;font-size:16px;min-width:40px;min-height:40px;border-radius:10px;background:transparent;color:var(--sub);border:0;cursor:pointer}
.mi .mx button:hover{background:var(--line)}
.dnh{display:flex;align-items:center;gap:8px;width:100%;margin-top:10px;padding:12px 4px;font:inherit;font-weight:800;font-size:16px;background:transparent;color:var(--sub);border:0;border-top:1px solid var(--line);cursor:pointer;text-align:left}
.dnh i{margin-left:auto;font-style:normal;transition:transform .2s}.dnh.open i{transform:rotate(180deg)}
.mtadd{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.mtadd input{flex:1 1 180px;min-height:46px;font:inherit;font-size:16px;padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--tx)}
.nudge{display:block;width:100%;margin-top:16px;background:var(--sun);color:var(--sunt);border-radius:16px;padding:14px 16px;font-weight:800;box-shadow:0 4px 0 var(--sunt);min-height:60px}
.nudge small{display:block;font-weight:600;font-size:14.5px}

.tl{position:relative;margin-left:14px;padding-left:26px;border-left:4px solid var(--sea)}
.slot{position:relative;margin-bottom:6px}
.slot .when{position:absolute;left:-52px;top:-2px;width:50px;text-align:center}
.slot .when i{display:flex;align-items:center;justify-content:center;width:36px;height:36px;margin:0 auto;border-radius:50%;background:var(--sun);border:3px solid var(--bg);font-style:normal;font-size:19px;box-shadow:0 0 0 3px var(--sea)}
.slot h3{font-family:var(--font-head);font-weight:400;font-size:17px;color:var(--sea2);margin:0 0 8px;padding-top:4px}
:root[data-theme=dark] .slot h3{color:var(--sea)}
.addslot{display:block;width:100%;margin:0 0 16px;border:2px dashed var(--sea);border-radius:14px;padding:11px 14px;font-weight:800;font-size:15.5px;color:var(--sea2);min-height:48px;text-align:center;transition:.15s}
:root[data-theme=dark] .addslot{color:var(--sea)}
.addslot:hover{background:var(--card)}
.post{background:var(--card);border-radius:18px;overflow:hidden;margin-bottom:14px;box-shadow:0 4px 0 var(--line);transition:transform .18s}
.post:hover{transform:translateY(-2px) rotate(-.4deg)}
.post .ph{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 16px;font-size:44px;color:#fff;position:relative}
.post .ph b{font-family:var(--font-head);font-weight:400;font-size:19px;text-align:right;text-shadow:0 1px 4px rgba(0,0,0,.3);line-height:1.2}
.pc-shop{background:linear-gradient(120deg,#F27F8E,#F5A25D)}.pc-eat{background:linear-gradient(120deg,#F59E0B,#EF6C3B)}.pc-stay{background:linear-gradient(120deg,#0E9AA7,#3D6FD1)}.pc-move{background:linear-gradient(120deg,#5668D9,#8E5BD6)}.pc-do{background:linear-gradient(120deg,#2BAE72,#0E9AA7)}
.post .bd{padding:12px 16px 14px}
.post .bd p{font-size:15.5px;color:var(--sub)}
.post .bd p.memo{color:var(--tx);white-space:pre-wrap;margin-top:6px;background:var(--bg);border-radius:12px;padding:8px 12px}
.post .row{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--sea);color:#fff;font-weight:800;border-radius:12px;padding:11px 15px;text-decoration:none;font-size:15.5px;min-height:46px;transition:transform .12s,filter .15s}
:root[data-theme=dark] .btn{color:#06222a}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:translateY(2px)}
.btn.ln{background:none;color:var(--sea2);border:2px solid var(--sea)}
:root[data-theme=dark] .btn.ln{color:var(--sea)}
.btn.big{width:100%;min-height:54px;font-size:18px}
.eta{font-family:var(--font-body);font-weight:700;font-size:15.5px;color:var(--sea2)}
:root[data-theme=dark] .eta{color:var(--sea)}
.tb{font-weight:800;font-size:14px;border:2px solid var(--line);border-radius:8px;padding:2px 9px;color:var(--sub)}
.tb.y{border-color:var(--ok);color:var(--ok)}.tb.n{border-color:var(--warn);color:var(--warn)}

.gcard{background:var(--card);border-radius:18px;margin-bottom:12px;overflow:hidden;box-shadow:0 4px 0 var(--line);transition:transform .18s}
.gcard:hover{transform:translateY(-2px)}
.gcard>button{display:grid;grid-template-columns:76px 1fr 28px;align-items:stretch;width:100%;min-height:84px}
.gcard .ph{display:flex;align-items:center;justify-content:center;font-size:36px;color:#fff}
.gcard .tx{padding:12px 12px}
.gcard .tx b{display:block;font-size:17.5px;line-height:1.3}.gcard .tx span{font-size:14.5px;color:var(--sub);display:block;margin-top:2px}
.gcard .chev{display:flex;align-items:center;font-size:14px;transition:transform .25s;color:var(--sub)}
.gcard.open .chev{transform:rotate(180deg);color:var(--sea)}
.gcard .more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}.gcard.open .more{grid-template-rows:1fr}.gcard .more>div{overflow:hidden}
.gcard .in{padding:4px 16px 18px}
.gcard ol{list-style:none;padding:0;counter-reset:s}
.gcard ol li{counter-increment:s;position:relative;padding:7px 0 7px 38px;font-size:17px}
.gcard ol li:before{content:counter(s);position:absolute;left:0;top:8px;width:27px;height:27px;border-radius:8px;background:var(--sun);color:var(--sunt);font-family:var(--font-num);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center}
.gcard .tips{margin-top:10px;border-left:5px solid var(--sea);background:var(--bg);padding:10px 14px;font-size:15.5px;border-radius:0 12px 12px 0;list-style:none}
.gcard .tips li{margin:5px 0}
.meta{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:12px;font-size:14px;color:var(--sub)}
.flag{font-weight:800;color:#C2410C;background:#FFEDD5;border-radius:8px;padding:2px 9px}
:root[data-theme=dark] .flag{background:#4a2a12;color:#FFB27A}

/* 지도 */
#ms{display:none;position:fixed;top:0;left:0;right:0;bottom:calc(68px + env(safe-area-inset-bottom));z-index:4;background:var(--line);overflow:hidden}
body.mapmode #ms{display:block}
#map{position:absolute;inset:0;z-index:0}
:root[data-theme=dark] #map .maplibregl-canvas{filter:invert(.9) hue-rotate(180deg) brightness(.9) saturate(.7)}
.maplibregl-ctrl-attrib{font-size:10px!important}
.mtop{position:absolute;left:12px;right:70px;top:calc(12px + env(safe-area-inset-top));z-index:5;background:var(--card);border-radius:14px;padding:10px 14px;box-shadow:0 3px 10px rgba(0,0,0,.22);font-weight:800;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mtop small{font-weight:600;color:var(--sub);font-size:13.5px}
.tools{position:absolute;right:10px;top:calc(12px + env(safe-area-inset-top));z-index:5;display:flex;flex-direction:column;gap:8px}
.tools button{width:48px;height:48px;background:var(--card);border-radius:14px;box-shadow:0 3px 10px rgba(0,0,0,.22);display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:19px;font-weight:700;line-height:1;text-align:center;transition:transform .1s,background .15s}
.tools button small{font-size:10px;font-weight:800;margin-top:1px}
.tools button:hover{background:var(--line)}.tools button.on,.tools button.on:hover{background:var(--sea);color:#fff}.tools button:active{transform:scale(.94)}
.madd{position:absolute;left:12px;top:calc(66px + env(safe-area-inset-top));z-index:5;background:var(--sun);color:var(--sunt);border-radius:14px;padding:12px 16px;font:inherit;font-weight:800;font-size:16px;box-shadow:0 3px 10px rgba(0,0,0,.22);cursor:pointer}
.madd:hover{filter:brightness(.95)}.madd:active{transform:scale(.97)}
#ms.picking .madd{display:none}
.rail{position:absolute;left:0;right:0;bottom:12px;z-index:6;display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 14px 6px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.pcard{flex:none;width:min(84%,330px);scroll-snap-align:center;background:var(--card);border-radius:18px;box-shadow:0 6px 16px rgba(0,0,0,.28);padding:12px 14px 14px;border:3px solid transparent;transition:border-color .2s}
.pcard.on{border-color:var(--sun)}
.pcard .t1{display:flex;gap:10px;align-items:center}
.pcard .ic{flex:none;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff}
.pcard b{display:block;font-size:17.5px;line-height:1.3}.pcard .s{font-size:14px;color:var(--sub);display:block}
.pcard .t2{display:flex;align-items:center;gap:8px;margin-top:10px}
.pcard .t2 .eta{font-size:14.5px;line-height:1.35}
.pcard .t2 .btn{padding:10px 12px;font-size:15px}
.pcard .t2 .btn:first-of-type{margin-left:auto}
.cross{display:none;position:absolute;left:50%;top:50%;width:0;height:0;z-index:7;pointer-events:none}
.cross:before{content:"📍";position:absolute;left:-20px;top:-46px;font-size:40px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
.cross:after{content:"";position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:50%;background:var(--sea);border:2px solid #fff}
.pickbar{display:none;position:absolute;left:12px;right:12px;bottom:14px;z-index:8;gap:10px}
.pickbar .btn{flex:1}
#ms.picking .cross{display:block}#ms.picking .pickbar{display:flex}#ms.picking .rail{display:none}

.mk{width:0;height:0;position:relative;cursor:pointer}
.mk .pi{position:absolute;left:-22px;top:-22px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:24px;background:var(--card);border:3px solid var(--sea);border-radius:14px;box-shadow:0 3px 8px rgba(0,0,0,.35);transition:transform .15s}
.mk:hover .pi{transform:scale(1.1)}
.mk.o-a .pi{border-color:#2F6FE0}.mk.o-b .pi{border-color:#E0457B}
.ob{display:inline-block;font-size:12.5px;font-weight:800;border-radius:6px;padding:1px 7px;margin-left:6px;vertical-align:1px;color:#fff;background:var(--sub)}
.ob.a{background:#2F6FE0}.ob.b{background:#E0457B}
.vw{display:flex;gap:6px;flex-wrap:wrap}
.vw button{font:inherit;font-weight:800;font-size:15px;min-height:40px;padding:6px 12px;border-radius:10px;background:var(--card);color:var(--tx);border:2px solid var(--line);cursor:pointer;transition:background .15s}
.vw button:hover{background:var(--line)}
.vw button.on,.vw button.on:hover{background:var(--sea);border-color:var(--sea);color:#fff}
#vwm{position:absolute;left:12px;right:70px;top:calc(120px + env(safe-area-inset-top));z-index:5}
#ms.picking #vwm{display:none}
#vw0{margin:4px 0 6px}
.who3{display:flex;gap:8px;flex-wrap:wrap}
.mk .pl{position:absolute;left:0;top:26px;transform:translateX(-50%);white-space:nowrap;font-weight:900;font-size:15px;color:var(--tx);text-shadow:-2px 0 var(--card),2px 0 var(--card),0 -2px var(--card),0 2px var(--card),0 0 5px var(--card);pointer-events:none}
.mk.sel .pi{background:var(--sun);border-color:var(--tx);transform:scale(1.28)}
.mk.home .pi{left:-28px;top:-28px;width:56px;height:56px;font-size:29px;background:var(--sea);border-color:var(--card)}
.mk.home .pl{top:34px;font-size:16px;color:var(--sea2)}
.mk.mkc .cl{position:absolute;left:-22px;top:-22px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-family:var(--font-num);font-weight:700;font-size:20px;background:var(--sun);color:var(--sunt);border:3px solid var(--card);border-radius:14px;box-shadow:0 3px 8px rgba(0,0,0,.35)}
.mk.ost{cursor:default;pointer-events:none}
.mk.ost span{position:absolute;left:0;top:-9px;transform:translateX(-50%);white-space:nowrap;font-size:13.5px;font-weight:800;color:var(--sea2);text-shadow:-2px 0 var(--card),2px 0 var(--card),0 -2px var(--card),0 2px var(--card)}
.mk.ost span:before{content:"🚇 "}
.ome{width:18px;height:18px;border-radius:50%;background:#2E7BFF;border:3px solid #fff;box-shadow:0 0 0 6px rgba(46,123,255,.3)}

/* 가계부 */
.money{background:var(--card);border-radius:18px;padding:16px 18px;box-shadow:0 4px 0 var(--line)}
.money .lab{font-size:14px;color:var(--sub)}.money .big{font-family:var(--font-num);font-weight:700;font-size:44px;line-height:1.1;color:var(--sea2)}
:root[data-theme=dark] .money .big{color:var(--sea)}
.calc{display:flex;align-items:center;gap:10px;margin:14px 0;background:var(--card);border-radius:18px;padding:12px 16px;box-shadow:0 4px 0 var(--line)}
.calc input{width:120px;font-family:var(--font-num)}
.calc output{font-weight:800;font-size:20px}
.q{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.q button{background:var(--card);border-radius:14px;padding:14px 6px;text-align:center;font-weight:800;box-shadow:0 3px 0 var(--line);transition:.12s;min-height:64px}
.q button:active{transform:translateY(2px);background:var(--line)}
.addex{background:var(--card);border-radius:18px;padding:14px 16px;box-shadow:0 4px 0 var(--line);margin-top:14px}
.addex .fr{margin-bottom:10px}
.scan{width:100%;margin-bottom:12px;padding:12px 10px;border-radius:14px;border:2px dashed var(--line);background:transparent;font:inherit;font-weight:700;color:inherit;cursor:pointer}
.scan:hover{background:var(--line)}
.scan:disabled{opacity:.55;cursor:default}
.exl{list-style:none;padding:0;margin-top:12px}.exl li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px solid var(--line)}.exl b{font-family:var(--font-num);font-size:18px}
.exl .nm{flex:1;min-width:0}.exl .nm small{display:block;color:var(--sub);font-size:13.5px;line-height:1.2}
.exl .x{width:44px;height:44px;border-radius:10px;color:var(--sub);font-size:18px;text-align:center}
.exl .x:hover{background:var(--line)}

/* 입력 공통 */
input,textarea,select{width:100%;background:var(--bg);color:var(--tx);border:2px solid var(--line);border-radius:12px;font:inherit;font-size:18px;padding:10px 12px;min-height:48px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--sea)}
textarea{resize:vertical;line-height:1.5}
.fl{display:block;margin:0 0 16px}.fl>span{display:block;font-weight:800;font-size:15px;margin-bottom:6px}
.fr{display:flex;gap:8px;align-items:stretch}
.fr .btn{flex:none;padding:8px 14px;min-width:68px}
.hint{font-size:14.5px;color:var(--sub);margin-top:6px}
.card{background:var(--card);border-radius:18px;padding:16px 16px 4px;box-shadow:0 4px 0 var(--line);margin-bottom:16px}
.card h3{font-family:var(--font-head);font-weight:400;font-size:20px;margin-bottom:12px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button{background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:8px 14px;font-weight:800;min-height:46px;font-size:16px}
.opts button.on{background:var(--sea);color:#fff;border-color:var(--sea)}

<script>
/* ===== 공통 지도 코어 (시안 A·B 같이 씀) ===== */
const PLACES=[
 {id:'hotel',n:'소테츠 프레사 인 기타하마',s:'숙소',c:'stay',i:'🏨',L:'K',code:'K14',ex:'5',al:'6번 출구도 가능',lat:34.6905,lng:135.5155,eta:null,home:1,d:'사카이스지선·게이한 본선 환승 · 역과 바로 연결. 캐리어는 엘리베이터 있는 출구로.'},
 {id:'morita',n:'모리타 만년필',s:'모리타',c:'shop',i:'🛍',L:'K',code:'K14',ex:'4',al:'기타하마역에서 도보 2분',lat:34.6912,lng:135.5140,eta:['도보','3분'],d:'기타하마역에서 걸어서 2분.'},
 {id:'moto',n:'모토커피',s:'모토커피',c:'eat',i:'☕',L:'K',code:'K14',ex:'26',al:'강변 방향',lat:34.6898,lng:135.5135,eta:['도보','4분'],d:'도사보리 강변 테라스.'},
 {id:'fresco',n:'프레스코 마트',s:'프레스코',c:'shop',i:'🛒',L:'K',code:'K14',ex:'4',al:'역 연결',lat:34.6908,lng:135.5150,eta:['도보','2분'],d:'숙소 근처 지하 슈퍼.'},
 {id:'life',n:'라이프 마트',s:'라이프',c:'shop',i:'🛒',L:'K',code:'K15',ex:'12',al:'사카이스지혼마치역 · 도보 3분',lat:34.6823,lng:135.5154,eta:['도보','12분'],d:'기타하마에서 한 정거장.'},
 {id:'dot',n:'도톤보리',s:'도톤보리',c:'eat',i:'🍜',L:'K',code:'K17',ex:'10',al:'닛폰바시역',lat:34.6687,lng:135.5013,eta:['지하철','9분'],d:'닛폰바시 10번 · 또는 난바 M20 14번 출구.'},
 {id:'itoya',n:'이토야 · 한큐백화점',s:'이토야',c:'shop',i:'🖋',L:'M',code:'M16',ex:'6',al:'우메다역 · 그랑프론트 방향',lat:34.7055,lng:135.4983,eta:['지하철','14분'],d:'미도스지선 우메다역에서 걸어요.'},
 {id:'harbs',n:'하브스 · 난바파크스',s:'하브스',c:'eat',i:'🍰',L:'M',code:'M20',ex:'—',al:'난바파크스 방향',lat:34.6655,lng:135.5011,eta:['지하철','11분'],d:'출구 번호는 현장 확인 필요.'},
 {id:'nankai',n:'난카이 난바역 (공항 가는 길)',s:'난카이',c:'move',i:'🚆',L:'N',code:'NK01',ex:'3층',al:'북쪽 개찰구',lat:34.6659,lng:135.5008,eta:['지하철','12분'],d:'메트로 개찰구 밖으로 나와 난카이 개찰구로 다시 입장.'}];
const STATIONS=[['기타하마역',34.6905,135.5155],['사카이스지혼마치역',34.6823,135.5154],['덴마바시역',34.6925,135.5215],['요도야바시역',34.6921,135.5011],['혼마치역',34.6830,135.5010],['닛폰바시역',34.6672,135.5064],['난바역',34.6659,135.5008],['우메다역',34.7055,135.4983]];

const OMap=(()=>{
 let map,sel=-1,flt='all',ready=false,mk=[],me=null,opt={},lab=false,hid=[];
 const applyLab=()=>{if(ready)hid.forEach(id=>{if(map.getLayer(id))map.setLayoutProperty(id,'visibility',lab?'visible':'none')})};
 const hav=(a,b)=>{const t=x=>x*Math.PI/180,R=6371,dl=t(b.lat-a.lat),dn=t(b.lng-a.lng),h=Math.sin(dl/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
 const home=()=>PLACES.find(p=>p.home);
 const vis=()=>PLACES.map((p,i)=>({p,i})).filter(o=>o.p.lat!=null&&(flt==='all'||o.p.c===flt||o.p.home)&&pShow(o.p));
 const bottomPad=()=>(opt.drawerH?opt.drawerH():90)+30;
 function box(cls,html){const d=document.createElement('div');d.className=cls;d.innerHTML=html;return d}
 function add(el,lng,lat,z){const m=new maplibregl.Marker({element:el}).setLngLat([lng,lat]).addTo(map);if(z)el.style.zIndex=z;mk.push(m);return m}
 function draw(){
  if(!ready)return;mk.forEach(m=>m.remove());mk=[];
  const z=map.getZoom(),cl=[],near=[];
  vis().forEach(o=>{
   const pt=map.project([o.p.lng,o.p.lat]);
   const alone=o.p.home||o.i===sel;
   const c=alone?null:cl.find(c=>!c.alone&&Math.hypot(c.x-pt.x,c.y-pt.y)<48);
   if(c)c.m.push(o);else cl.push({x:pt.x,y:pt.y,m:[o],alone});
  });
  cl.forEach(c=>{
   if(c.m.length>1){
    const e=box('mk mkc','<span class="cl">'+c.m.length+'</span>');
    const cx=c.m.reduce((a,o)=>a+o.p.lng,0)/c.m.length,cy=c.m.reduce((a,o)=>a+o.p.lat,0)/c.m.length;
    e.onclick=ev=>{ev.stopPropagation();const b=new maplibregl.LngLatBounds();c.m.forEach(o=>b.extend([o.p.lng,o.p.lat]));map.fitBounds(b,{padding:{top:70,left:60,right:60,bottom:bottomPad()+20},maxZoom:17.5,duration:500})};
    add(e,cx,cy,2);return;
   }
   const o=c.m[0],p=o.p;
   const showLabel=z>=14.3||p.home||o.i===sel;
   const e=box('mk'+(p.home?' home':'')+(!p.home&&twoOn()&&p.o?' o-'+p.o:'')+(o.i===sel?' sel':''),'<span class="pi">'+p.i+'</span>'+(showLabel?'<span class="pl">'+p.s+'</span>':''));
   e.onclick=ev=>{ev.stopPropagation();opt.onPick&&opt.onPick(o.i)};
   add(e,p.lng,p.lat,o.i===sel?9:(p.home?5:3));
   near.push(p);
  });
  if(z>=14){
   STATIONS.forEach(s=>{if(PLACES.some(p=>hav({lat:s[1],lng:s[2]},p)<0.14))return;add(box('mk ost','<span>'+s[0]+'</span>'),s[2],s[1],1)});
  }
 }
 function line(){
  const src=map.getSource('rt');if(!src||opt.noLine)return;
  const h=home();
  src.setData(sel>=0&&!PLACES[sel].home?{type:'Feature',geometry:{type:'LineString',coordinates:[[h.lng,h.lat],[PLACES[sel].lng,PLACES[sel].lat]]}}:{type:'FeatureCollection',features:[]});
 }
 function init(o){
  opt=o;
  map=new maplibregl.Map({container:o.el,style:'https://tiles.openfreemap.org/styles/liberty',center:[135.51,34.686],zoom:13,attributionControl:{compact:true},dragRotate:false,pitchWithRotate:false});
  map.touchZoomRotate.disableRotation();
  map.on('load',()=>{
   map.getStyle().layers.forEach(l=>{if(l.type==='symbol'&&l.layout&&l.layout['text-field'])map.setLayoutProperty(l.id,'text-field',['coalesce',['get','name:ko'],['get','name:latin'],['get','name']])});
   ['label_other','highway-name-minor','highway-name-path','poi_r20','poi_r7','poi_r1'].forEach(id=>{if(map.getLayer(id)){map.setLayoutProperty(id,'visibility','none');hid.push(id)}});
   if(o.simple){map.getStyle().layers.forEach(l=>{const id=l.id;
    const hide=l.type==='symbol'||/^building/.test(id)||/(minor|path|service|link|rail|street|casing|boundary|area_pattern|secondary_tertiary)/.test(id)||/^(landuse_|landcover_)/.test(id)&&id!=='landcover_wood'&&id!=='landcover_grass';
    if(hide&&map.getLayer(id)){map.setLayoutProperty(id,'visibility','none');if(!hid.includes(id))hid.push(id)}});
    ['road_trunk_primary','road_motorway'].forEach(id=>{if(map.getLayer(id)){map.setLayoutProperty(id,'visibility','visible');map.setPaintProperty(id,'line-color',o.road||'#ffffff')}});}
   map.addSource('rt',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
   map.addLayer({id:'rt',type:'line',source:'rt',paint:{'line-color':o.accent||'#d33','line-width':4,'line-dasharray':[1.5,1.5]}});
   ready=true;applyLab();draw();fit();if(sel>=0)select(sel);
  });
  map.on('zoomend',draw);map.on('moveend',draw);
  map.on('click',()=>o.onPick&&o.onPick(-1));
 }
 function fit(all){
  if(!ready)return;
  const h=home(),b=new maplibregl.LngLatBounds();
  vis().map(o=>o.p).filter(p=>all||hav(h,p)<1.3).forEach(p=>b.extend([p.lng,p.lat]));
  map.fitBounds(b,{padding:{top:60,left:50,right:50,bottom:bottomPad()},maxZoom:16,duration:500});
 }
 function select(i){
  sel=i;if(!ready)return;draw();line();
  if(i>=0){const p=PLACES[i];map.flyTo({center:[p.lng,p.lat],zoom:Math.max(map.getZoom(),15.8),offset:[0,-bottomPad()/2+20],duration:600})}
 }
 function locate(){
  const fail=()=>opt.toast&&opt.toast('위치 허용이 필요해요');
  if(!navigator.geolocation)return fail();
  navigator.geolocation.getCurrentPosition(pos=>{
   const ll=[pos.coords.longitude,pos.coords.latitude];
   if(!me)me=new maplibregl.Marker({element:box('ome','')}).setLngLat(ll).addTo(map);else me.setLngLat(ll);
   map.flyTo({center:ll,zoom:16});
  },fail,{enableHighAccuracy:true,timeout:8000});

function Drawer(sheet,handle,o){
 let state='peek',y0=0,h0=0,drag=false,moved=false;
 const H=()=>({peek:o.peek(),open:Math.round(o.open())});
 function snap(s){state=s;sheet.style.transition='height .26s cubic-bezier(.2,.8,.2,1)';sheet.style.height=H()[s]+'px';o.onChange&&o.onChange(s)}
 handle.addEventListener('pointerdown',e=>{drag=true;moved=false;y0=e.clientY;h0=sheet.offsetHeight;sheet.style.transition='none';handle.setPointerCapture(e.pointerId)});
 handle.addEventListener('pointermove',e=>{if(!drag)return;if(Math.abs(y0-e.clientY)>5)moved=true;const h=H();sheet.style.height=Math.max(h.peek,Math.min(h.open,h0+y0-e.clientY))+'px'});
 handle.addEventListener('pointerup',()=>{if(!drag)return;drag=false;const h=H();if(!moved)return snap(state==='peek'?'open':'peek');snap(sheet.offsetHeight>(h.peek+h.open)/2?'open':'peek')});
 snap('peek');
 return{snap,get state(){return state}};
}
const hv=(a,b)=>{const t=x=>x*Math.PI/180,R=6371,dl=t(b.lat-a.lat),dn=t(b.lng-a.lng),h=Math.sin(dl/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))};

/* 구글 지도 링크 → 이름·좌표 */
function parseGmap(u){
 let t=u;try{t=decodeURIComponent(u)}catch(e){}
 let lat=null,lng=null,m;
 if(m=/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/.exec(t)){lat=+m[1];lng=+m[2]}
 else if(m=/@(-?\d+\.\d+),(-?\d+\.\d+)/.exec(t)){lat=+m[1];lng=+m[2]}
 else if(m=/[?&](?:q|ll|query)=(-?\d+\.\d+),\s*(-?\d+\.\d+)/.exec(t)){lat=+m[1];lng=+m[2]}
 let n='';if(m=/\/maps\/place\/([^\/@?]+)/.exec(t))n=m[1].replace(/\+/g,' ').trim();
 else if((m=/[?&]q=([^&]+)/.exec(t))&&!/^-?\d/.test(m[1]))n=m[1].replace(/\+/g,' ').trim();
 return{lat,lng,n};
}
async function gmapGo(){
 const raw=($('#gl').value||'').trim();
 if(!/^https?:\/\//i.test(raw)){gtoast('구글 지도에서 복사한 링크를 붙여 넣어 주세요');return}
 const b=document.querySelector('[onclick="gmapGo()"]'),t0=b.textContent;b.disabled=true;b.textContent='…';
 try{
  let u=raw;
  if(!/google\.[a-z.]+\/maps/i.test(u)||!/@-?\d|!3d/.test(u)){
   const c=syncCfg();
   if(!c.on||!c.url||!c.code){gtoast('짧은 링크는 정보 탭에서 "같이 쓰기"를 연결해야 풀어요. 긴 링크를 쓰거나 이름으로 찾아 주세요');return}
   const r=await fetch(c.url,{method:'POST',body:JSON.stringify({k:c.code,act:'resolve',url:raw}),redirect:'follow'});
   const j=await r.json();
   if(!j.ok)throw new Error(j.error||'fail');
   u=j.url;
  }
  const g=parseGmap(u);
  if(g.lat!=null){
   draft.lat=g.lat;draft.lng=g.lng;if(g.n&&!draft.n.trim())draft.n=g.n.slice(0,40);
   renderSheet();gtoast('구글 지도 위치를 가져왔어요 ✓');
  }else if(g.n){
   draft.n=g.n.slice(0,40);renderSheet();$('#sq').value=g.n;gtoast('좌표가 없어 이름으로 찾아요');doSearch();
  }else gtoast('링크에서 장소를 못 읽었어요. 이름으로 찾아 주세요');
 }catch(e){
  const m=e.message;gtoast(m==='code'?'비밀 코드가 달라요':m==='host'?'구글 지도 링크가 아니에요':'링크를 못 풀었어요. 인터넷이나 같이 쓰기 연결을 확인해 주세요');
 }finally{const bb=document.querySelector('[onclick="gmapGo()"]');if(bb){bb.disabled=false;bb.textContent=t0}}
}

  const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&accept-language=ko&countrycodes=jp&viewbox=135.35,34.80,135.65,34.55&q='+encodeURIComponent(q));

function sayRobot(k){  /* 녹음 파일이 없을 때만 쓰는 예비 목소리 */
 if(!('speechSynthesis' in window)){gtoast('이 폰에서는 소리 읽기를 지원하지 않아요');return}
 const s=window.speechSynthesis;s.cancel();
 const u=new SpeechSynthesisUtterance(PHR[k][0]);u.lang='ja-JP';u.rate=.9;
 const vs=s.getVoices().filter(x=>/^ja/i.test(x.lang));if(vs[0])u.voice=vs[0];
 s.speak(u);
}
function say(k){  /* 진짜 사람 같은 녹음 파일(audio/p0-f.mp3 …)을 재생 */
 if(AU){AU.pause();AU=null}
 const a=new Audio('audio/p'+k+'.mp3');AU=a;
 a.onerror=()=>sayRobot(k);
 a.play().catch(()=>{});
}
